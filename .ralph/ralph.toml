[workspace]
version = "1.0"
default_backend = "claude"
tmux = false
daemon_poll_seconds = 30
daemon_max_concurrent = 5
daemon_labels = ["ralph:ready"]
daemon_refinement_enabled = false
daemon_auto_rebase_enabled = true
daemon_rebase_interval_seconds = 1800
daemon_max_rebases_per_cycle = 3
daemon_rebase_timeout_seconds = 120
daemon_rebase_agent_backend = "claude(opus)"
daemon_prd_enabled = false
daemon_prd_writer_backend = "claude"
daemon_prd_reviewer_backend = "claude"
daemon_pr_review_whitelist = ["douglaz"]

[backends.claude]
command = "claude"
args = [
    "-p",
    "--permission-mode",
    "acceptEdits",
    "--allowedTools",
    "Bash,Edit,Write,Read,Glob,Grep,WebSearch,WebFetch,Task,TaskOutput,TaskStop",
]
timeout_seconds = 7200
enabled = "auto"

[backends.claude.env]

[backends.claude.models]
planner = "opus"
implementer = "opus"
reviewer = "opus"
final_reviewer = "opus"
arbiter = "opus"
qa = "opus"
completer = "opus"
acceptance_qa = "opus"
reformatter = "sonnet"

[backends.claude.role_timeouts]

[backends.codex]
command = "codex"
args = [
    "exec",
    "--dangerously-bypass-approvals-and-sandbox",
    "-",
]
timeout_seconds = 7200
enabled = false

[backends.codex.env]

[backends.codex.models]

[backends.codex.role_timeouts]

[workflow]
reviewer_backend = "claude"
max_review_iterations = 10
auto_commit = true
commit_message_style = "conventional"
commit_tag_format = "ralph/{project_id}/loop-{loop_number}"
prompt_change_action = "abort"
prompt_review_enabled = false
prompt_review_backend = "claude"
final_review_enabled = false
final_review_backends = ["claude"]
final_review_arbiter_backend = "claude"
final_review_min_reviewers = 1
final_review_consensus_threshold = 1.0
max_final_review_restarts = 5
completion_backends = ["claude"]
completion_min_completers = 1
qa_enabled = false
max_qa_iterations = 3
planner_state_in_prompt = "summary"
planner_previous_specs_in_prompt = "titles"
planner_max_prior_loops = 10
max_review_history_entries_in_prompt = 3
max_qa_history_entries_in_prompt = 2
session_reuse_enabled = false

[git]
auto_branch = true
branch_format = "ralph/{project_id}"
sign_commits = false
base_branch = "master"
